<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hannover Frühausgabe</title>
<style>
  :root { --bg:#f7f3ec; --ink:#1f1b16; --muted:#6b6258; --accent:#b4432b; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:"Iowan Old Style", Georgia, serif;
         display:flex; min-height:100vh; align-items:center; justify-content:center; padding:16px; }
  main { max-width:560px; text-align:center; }
  .eyebrow { font-family:"Helvetica Neue", Arial, sans-serif; font-size:12px;
             letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  h1 { font-size:clamp(32px, 7vw, 52px); margin:.2em 0 .3em; }
  p { color:var(--muted); line-height:1.5; }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <div class="eyebrow">Hannover · Deutschland · Welt</div>
  <h1>Hannover Frühausgabe</h1>
  <p>Die tägliche KI-Morgenzeitung erscheint hier bald jeden Morgen um 6:00 Uhr.</p>
  <p><a href="https://hilmerjahnke.de">hilmerjahnke.de</a></p>
</main>
</body>
</html>
